<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · debrid-watch</title>
  <style>
    :root {
      --bg: #f7f7f8; --fg: #1d1d1f; --muted: #6b6b73; --card: #fff; --border: #e3e3e8;
      --accent: #2f6fde; --ok: #1f8a4c; --err: #c4352b; --warn: #b7791f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16161a; --fg: #ececf1; --muted: #9a9aa5; --card: #1f1f24; --border: #2f2f36;
        --accent: #6b9cff; --ok: #4cc27f; --err: #f06a5f; --warn: #e0a84a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--border); }
    header .inner, main { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    header .inner { display: flex; align-items: center; gap: 24px; height: 56px; }
    header .brand { font-weight: 600; }
    header nav a { color: var(--muted); text-decoration: none; margin-right: 16px; }
    header nav a.active, header nav a:hover { color: var(--fg); }
    main { padding-top: 24px; padding-bottom: 48px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    a { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .notice { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid; }
    .notice.error { color: var(--err); border-color: var(--err); }
    .notice.ok { color: var(--ok); border-color: var(--ok); }
    .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 13px; color: var(--muted); font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    td.name { word-break: break-all; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    .status { white-space: nowrap; font-size: 13px; }
    .status.ready { color: var(--ok); }
    .status.error { color: var(--err); }
    .status.active { color: var(--warn); }
    label { display: block; font-weight: 500; margin-bottom: 6px; }
    input[type=password], input[type=text] {
      width: 100%; padding: 8px 10px; font: inherit; color: var(--fg);
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
    button { margin-top: 12px; padding: 8px 16px; font: inherit; border: 0; border-radius: 6px;
             background: var(--accent); color: #fff; cursor: pointer; }
    button.secondary { background: transparent; color: var(--err); border: 1px solid var(--border); margin-left: 8px; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
    form.card + form.card { margin-top: 16px; }
    code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
    .notice.pending { color: var(--warn); border-color: var(--warn); }
    .magnet { margin-bottom: 16px; }
    .magnet .notice { margin: 12px 0 0; }
    .magnet-head { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; }
    .magnet-head h2 { font-size: 16px; margin: 0; word-break: break-all; }
    .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
             border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
    .meta { font-size: 13px; margin-top: 4px; }
    .dests { margin: 12px 0 4px; font-size: 13px; }
    .dests code { display: inline-block; margin: 2px 6px 2px 0; }
    table.files { font-size: 13px; margin-top: 8px; }
    tr.excluded td { color: var(--muted); text-decoration: line-through; }
    tr.excluded td:last-child { text-decoration: none; font-style: italic; }
    .rename { color: var(--muted); margin-top: 2px; }
    .name-form { margin-top: 12px; }
    .name-form label { font-size: 13px; }
    .name-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .name-row input { flex: 1 1 240px; width: auto; }
    .name-row button { margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <span class="brand">debrid-watch</span>
      <nav>
        <a href="/" {% block nav_home %}{% endblock %}>Home</a>
        <a href="/settings" {% block nav_settings %}{% endblock %}>Settings</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
